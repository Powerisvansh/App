<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGradient)" />

  <!-- Subtle Map Grid -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Stylized Route Curve -->
  <path d="M 150 280 C 350 280, 450 140, 650 180 C 800 210, 950 110, 1050 140" 
        fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6" filter="url(#glow)" />

  <!-- Origin Pin (Nilokheri) -->
  <g transform="translate(150, 280)">
    <circle r="18" fill="rgba(56, 189, 248, 0.2)" />
    <circle r="9" fill="#38BDF8" />
    <circle r="4" fill="#FFFFFF" />
    <text x="0" y="38" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Origin: Nilokheri</text>
  </g>

  <!-- Transit Waypoint -->
  <g transform="translate(650, 180)">
    <circle r="14" fill="rgba(245, 158, 11, 0.2)" />
    <circle r="7" fill="#F59E0B" />
    <circle r="3" fill="#FFFFFF" />
    <text x="0" y="32" text-anchor="middle" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Route Traveled (18.4 km)</text>
  </g>

  <!-- Destination Pin (Karnal) -->
  <g transform="translate(1050, 140)">
    <circle r="20" fill="rgba(52, 211, 153, 0.25)" />
    <circle r="10" fill="#34D399" />
    <circle r="4" fill="#FFFFFF" />
    <text x="0" y="38" text-anchor="middle" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Destination: Karnal</text>
  </g>

  <!-- Title & Branding -->
  <text x="600" y="70" text-anchor="middle" fill="url(#accentGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5">DAILYTRACK</text>
  <text x="600" y="105" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">Personal Routine &amp; Journey Tracker • 100% On-Device &amp; Private</text>

  <!-- Bottom Feature Badges -->
  <g transform="translate(600, 350)">
    <text x="0" y="0" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">
      📍 Real Location Detection  •  ⏱️ Automatic Dwell Timestamps  •  🗺️ Google Maps Directions  •  🔒 Local SQLite
    </text>
  </g>
</svg>
