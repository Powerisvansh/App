<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="auto">
  <defs>
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="16" fill="url(#layerGrad1)" stroke="#334155" stroke-width="2"/>

  <text x="500" y="45" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">DailyTrack Clean Architecture &amp; Data Pipeline</text>

  <!-- Column 1: Presentation Layer -->
  <g transform="translate(40, 80)">
    <rect width="270" height="360" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="#0284C7" stroke-width="2" />
    <rect width="270" height="40" rx="12" fill="url(#boxGrad1)" />
    <text x="135" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">PRESENTATION LAYER</text>

    <g transform="translate(15, 60)" font-family="sans-serif" font-size="12" fill="#E2E8F0">
      <rect width="240" height="42" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="26" font-weight="600">Dashboard &amp; Live Status</text>

      <rect y="55" width="240" height="42" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="81" font-weight="600">Daily Activity Timeline</text>

      <rect y="110" width="240" height="42" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="136" font-weight="600">Interactive Route Map View</text>

      <rect y="165" width="240" height="42" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="191" font-weight="600">Place Details &amp; Rename</text>

      <rect y="220" width="240" height="42" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="246" font-weight="600">MainViewModel (StateFlow)</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M 325 250 L 365 250" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4 2"/>

  <!-- Column 2: Domain Layer -->
  <g transform="translate(370, 80)">
    <rect width="260" height="360" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="#0D9488" stroke-width="2" />
    <rect width="260" height="40" rx="12" fill="url(#boxGrad2)" />
    <text x="130" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">DOMAIN LOGIC</text>

    <g transform="translate(15, 60)" font-family="sans-serif" font-size="12" fill="#E2E8F0">
      <rect width="230" height="52" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-weight="600">VisitDetector Engine</text>
      <text x="12" y="40" fill="#94A3B8" font-size="11">Dwell threshold &amp; clustering</text>

      <rect y="65" width="230" height="52" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="89" font-weight="600">Multi-Tier Geocoder</text>
      <text x="12" y="105" fill="#94A3B8" font-size="11">System + OSM + Gazetteer</text>

      <rect y="130" width="230" height="52" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="154" font-weight="600">Route Journey Calculator</text>
      <text x="12" y="170" fill="#94A3B8" font-size="11">Speed, distance &amp; waypoints</text>

      <rect y="195" width="230" height="52" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="219" font-weight="600">DailySummary Aggregator</text>
      <text x="12" y="235" fill="#94A3B8" font-size="11">Moving vs stationary time</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M 645 250 L 685 250" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="4 2"/>

  <!-- Column 3: Data & Background Layer -->
  <g transform="translate(690, 80)">
    <rect width="270" height="360" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="#D97706" stroke-width="2" />
    <rect width="270" height="40" rx="12" fill="url(#boxGrad3)" />
    <text x="135" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">DATA &amp; BACKGROUND</text>

    <g transform="translate(15, 60)" font-family="sans-serif" font-size="12" fill="#E2E8F0">
      <rect width="240" height="50" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="22" font-weight="600">FusedLocationProvider</text>
      <text x="12" y="38" fill="#94A3B8" font-size="11">High accuracy GPS updates</text>

      <rect y="60" width="240" height="50" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="82" font-weight="600">Foreground Service</text>
      <text x="12" y="98" fill="#94A3B8" font-size="11">Persistent Android 14/15 type</text>

      <rect y="120" width="240" height="50" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="142" font-weight="600">Room SQLite Database</text>
      <text x="12" y="158" fill="#94A3B8" font-size="11">LocationPoint, Visit, Cache</text>

      <rect y="180" width="240" height="50" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="202" font-weight="600">DataStore Preferences</text>
      <text x="12" y="218" fill="#94A3B8" font-size="11">User intervals, radius, auto-del</text>
    </g>
  </g>
</svg>
